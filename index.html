<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accord</title>
    <script>
      (() => {
        // Persistentie (src/lib/settings.ts) is synchrone localStorage, dus
        // hier al leesbaar vóór React mount: voorkomt een flash naar het
        // systeemthema als de gebruiker een hard thema koos.
        var stored = null;
        var raw;
        try {
          raw = localStorage.getItem("pr-cockpit.settings");
          if (raw) stored = JSON.parse(raw).theme;
        } catch (_e) {}
        var isHard = stored === "light" || stored === "dark";
        var media = window.matchMedia("(prefers-color-scheme: dark)");
        function applyTheme(matches) {
          document.documentElement.dataset.theme = isHard
            ? stored
            : matches
              ? "dark"
              : "light";
        }
        applyTheme(media.matches);
        // Bij een hard thema neemt applyTheme (src/lib/theme.ts) dit meteen na
        // mount over; deze listener is dan alleen nog relevant vóór dat moment.
        media.addEventListener("change", (event) => applyTheme(event.matches));
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
