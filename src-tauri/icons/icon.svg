<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Bron voor `pnpm tauri icon src-tauri/icons/icon.svg`: macOS-sjabloon, 824px tegel op een 1024-canvas.
       Neem van de output alleen de bestanden over die hier al staan, en kopieer 128x128@2x.png naar public/icon.png (favicon). -->
  <title>Accord</title>
  <!-- De sidebar toont alleen de tegel, via icon.svg#tile (Sidebar.tsx). -->
  <view id="tile" viewBox="100 100 824 824"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2230"/>
      <stop offset="1" stop-color="#0c1017"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d4dae4"/>
    </linearGradient>
    <clipPath id="tile-clip">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <g clip-path="url(#tile-clip)" fill="none" stroke="#3a4558" stroke-width="10" stroke-linecap="round" opacity="0.6">
    <path d="M220 100 V330 Q220 380 260 400 V924"/>
    <circle cx="260" cy="560" r="20" fill="#0f141c"/>
    <path d="M790 100 V280 Q790 330 760 350 V924"/>
    <circle cx="760" cy="470" r="20" fill="#0f141c"/>
    <path d="M840 520 V924"/>
    <circle cx="840" cy="720" r="20" fill="#0f141c"/>
    <path d="M180 650 V924"/>
  </g>
  <g fill="none" stroke="url(#glyph)" stroke-width="50" stroke-linecap="round" stroke-linejoin="round">
    <path d="M606 640 V430 Q606 340 516 340 H352"/>
    <path d="M442 250 L352 340 L442 430"/>
    <circle cx="606" cy="700" r="60"/>
  </g>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="2"/>
</svg>
