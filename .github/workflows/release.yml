# Bouwt Accord voor macOS en Linux. Met een tag (van release-please, of een
# handgezette v*-tag) worden de installers aan de GitHub Release van die tag
# gehangen; een handmatige run (workflow_dispatch) bouwt alleen en hangt de
# bundels als artifacts aan de run.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  # Aangeroepen door release.yml's tegenhanger release-please.yml: een tag die
  # een Action met de GITHUB_TOKEN pusht triggert namelijk geen workflows, dus
  # de release-PR-merge roept deze build direct aan in plaats van via de tag.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      release_body:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux systeemdependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # De updater vergelijkt met de ingebouwde Tauri-versie. Zonder deze
      # override zou een v0.2.0-tag nog steeds de vaste 0.1.0 uit
      # tauri.conf.json publiceren en zien bestaande installaties geen update.
      - name: Appversie uit releasetag
        if: env.TAG != ''
        shell: bash
        run: |
          release_version="${TAG#v}"
          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Ongeldige releasetag: $TAG" >&2
            exit 1
          fi
          printf '{"version":"%s"}\n' "$release_version" > src-tauri/tauri.release.conf.json

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # beforeBuildCommand draait vite build in deze step: zonder deze var
          # is de client ID leeg en toont de app het "geen Client ID"-scherm.
          # Een device-flow client ID is geen secret, dus een repo variable.
          VITE_GITHUB_CLIENT_ID: ${{ vars.VITE_GITHUB_CLIENT_ID }}
          # Zonder deze twee draait de build wel, maar levert hij geen
          # ondertekende updater-artifacts (en dus geen latest.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: ${{ env.TAG != '' && format('Accord {0}', env.TAG) || '' }}
          releaseBody: ${{ inputs.release_body || '' }}
          args: ${{ env.TAG != '' && '--config src-tauri/tauri.release.conf.json' || '' }}

      - name: Bundels als run-artifact (geen tag)
        if: ${{ env.TAG == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: accord-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
