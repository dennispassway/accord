# Houdt een release-PR bij op basis van de conventional commits op main. De
# merge van die PR bumpt de versie, schrijft de CHANGELOG en maakt tag +
# GitHub Release; daarna bouwt release.yml de installers erbij.
name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_body: ${{ steps.release.outputs.body }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # De action kent geen assignees; wijs de release-PR aan de repo-eigenaar
      # toe. Draait bij elke update opnieuw, dat is idempotent.
      - name: Release-PR aan de eigenaar toewijzen
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ fromJSON(steps.release.outputs.pr).number }}
          OWNER: ${{ github.repository_owner }}
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-assignee "$OWNER"

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      release_body: ${{ needs.release-please.outputs.release_body }}
    secrets: inherit
    permissions:
      contents: write
